version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: epad-postgres
    environment:
      POSTGRES_USER: epad
      POSTGRES_PASSWORD: epad
      POSTGRES_DB: epad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: epad-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
